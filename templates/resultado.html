{% extends "base.html" %}
{% block content %}
<div class="panel">
  <h2>Listo</h2>
  <p class="lede">El archivo se generó correctamente. Revisa los avisos de arriba antes de descargarlo.</p>

  <a class="descarga-boton" href="{{ url_for('descargar', token=token) }}" download>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3v12m0 0l-4-4m4 4l4-4"></path>
      <path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"></path>
    </svg>
    Descargar {{ nombre_salida }}
  </a>

  <div class="back-row">
    <a class="back-button" href="{{ url_for('ampliar', tipo_id=tipo_id) }}">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5m0 0l6-6m-6 6l6 6"></path>
      </svg>
      Ampliar otro archivo
    </a>
    <a class="back-button" href="{{ url_for('index') }}">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5m0 0l6-6m-6 6l6 6"></path>
      </svg>
      Cambiar tipo de ampliación
    </a>
  </div>
</div>
{% endblock %}
